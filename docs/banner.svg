<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="RouteFlow — Your day, routed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF9F7"/>
      <stop offset="100%" stop-color="#F0EEFB"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#E7E5E2">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
  </g>
  <!-- route path -->
  <path d="M 120 240 C 240 240, 260 120, 420 120 C 580 120, 600 200, 760 200 C 900 200, 920 100, 1040 100"
        fill="none" stroke="#5B5BD6" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 12"/>
  <circle cx="120" cy="240" r="11" fill="#FFFFFF" stroke="#5B5BD6" stroke-width="5"/>
  <circle cx="760" cy="200" r="11" fill="#FFFFFF" stroke="#5B5BD6" stroke-width="5"/>
  <circle cx="590" cy="131" r="7" fill="#5B5BD6"/>
  <circle cx="1040" cy="100" r="14" fill="#5B5BD6"/>
  <path d="M1035 96 l4 4 7-8" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="120" y="96" font-size="44" font-weight="700" fill="#1A181D" letter-spacing="-1">RouteFlow</text>
    <text x="120" y="140" font-size="21" fill="#5C5860">Your day, routed — a local-first productivity OS</text>
  </g>
  <!-- chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="740" y="238" width="132" height="40" rx="20" fill="#EEEDFC"/>
    <text x="806" y="264" fill="#4848BE" text-anchor="middle">Local-first</text>
    <rect x="886" y="238" width="128" height="40" rx="20" fill="#EEEDFC"/>
    <text x="950" y="264" fill="#4848BE" text-anchor="middle">AI-native</text>
    <rect x="1028" y="238" width="204" height="40" rx="20" fill="#15856B" opacity="0.12"/>
    <text x="1130" y="264" fill="#15856B" text-anchor="middle">Markdown vault</text>
  </g>
</svg>
