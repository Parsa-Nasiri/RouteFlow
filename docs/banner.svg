<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="RouteFlow — Your day, routed. Local-first productivity with a Markdown vault and native AI control.">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E6BF2"/>
      <stop offset="55%" stop-color="#7C7CF0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6E6BF2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6E6BF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="360" rx="28" fill="#0B0C10"/>
  <rect x="1.5" y="1.5" width="1277" height="357" rx="26.5" fill="none" stroke="#23252F"/>
  <rect x="8" y="8" width="1264" height="344" rx="22" fill="url(#dots)"/>
  <ellipse cx="1020" cy="30" rx="360" ry="200" fill="url(#glowA)"/>
  <ellipse cx="220" cy="330" rx="320" ry="180" fill="url(#glowB)"/>

  <!-- route -->
  <path d="M 64 96 C 210 96, 236 54, 396 54 C 556 54, 574 100, 752 92 C 930 84, 952 44, 1122 46 L 1176 47"
        fill="none" stroke="url(#flow)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.5 13"
        filter="url(#soft)" opacity="0.5"/>
  <path d="M 64 96 C 210 96, 236 54, 396 54 C 556 54, 574 100, 752 92 C 930 84, 952 44, 1122 46 L 1176 47"
        fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.5 13"/>
  <circle cx="64" cy="96" r="10" fill="#0B0C10" stroke="#7C7CF0" stroke-width="4.5"/>
  <circle cx="752" cy="92" r="10" fill="#0B0C10" stroke="#7C7CF0" stroke-width="4.5"/>
  <circle cx="1176" cy="47" r="15" fill="url(#flow)"/>
  <path d="M1170 47 l4.5 4.5 8-9.5" fill="none" stroke="#0B0C10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lockup -->
  <g>
    <rect x="598" y="128" width="84" height="84" rx="22" fill="url(#flow)"/>
    <path d="M 622 184 C 622 162, 640 167, 644 150 C 647.5 136, 660 136, 662 144"
          fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="622" cy="184" r="7" fill="#FFFFFF"/>
    <circle cx="662" cy="144" r="7" fill="#FFFFFF"/>
  </g>
  <text x="640" y="266" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="800" fill="#F4F5FA" letter-spacing="-1.2">RouteFlow</text>
  <text x="640" y="300" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" fill="#9AA0B4">Your day, routed&#160;—&#160;a local-first productivity OS</text>
  <text x="640" y="336" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="700" fill="#8B8FF2" letter-spacing="4.5">LOCAL-FIRST&#160;&#160;·&#160;&#160;MARKDOWN VAULT&#160;&#160;·&#160;&#160;AI-NATIVE</text>
</svg>
